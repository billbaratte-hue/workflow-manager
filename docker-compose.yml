services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow_manager_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_TYPE=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=workflow_db
      - DB_USER=workflow_user
      - DB_PASSWORD=workflow_password
      - JWT_SECRET=change_this_secret_in_production_nis2
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - app_uploads:/app/uploads

  mariadb:
    image: mariadb:11.4
    container_name: workflow_manager_mariadb
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_ROOT_PASSWORD=root_super_secure_password
      - MARIADB_DATABASE=workflow_db
      - MARIADB_USER=workflow_user
      - MARIADB_PASSWORD=workflow_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/init-mariadb.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mariadb_data:
  app_uploads:
